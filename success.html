<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank you | Little Spark Jewellery</title><link rel="stylesheet" href="styles.css"></head><body><main style="min-height:80vh;display:grid;place-items:center;padding:30px"><section style="max-width:650px;text-align:center;background:white;border:1px solid #eadfe3;border-radius:28px;padding:50px"><div style="font-size:48px">✦</div><p class="eyebrow">ORDER RECEIVED</p><h1 style="font-family:serif;font-size:48px">Thank you!</h1><p id="status">We're checking your payment details…</p><a class="btn primary" href="/">Back to the shop</a></section></main><script>(async()=>{const id=new URLSearchParams(location.search).get("session_id");if(!id)return;try{const r=await fetch("/api/checkout-session?session_id="+encodeURIComponent(id));const d=await r.json();if(d.payment_status==="paid"){localStorage.removeItem("littleSparkCart");document.querySelector("#status").textContent="Payment received"+(d.customer_name?", "+d.customer_name:"")+". Your order total is £"+(d.amount_total/100).toFixed(2)+". A receipt will be sent to "+(d.customer_email||"the email used at checkout")+"."}else document.querySelector("#status").textContent="Your checkout was created, but payment is not marked as paid yet."}catch(e){document.querySelector("#status").textContent="Thanks for your order. Please check your email for your Stripe payment receipt."}})();</script></body></html>
